<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Register | StudyFlow</title>
</head>

<body>
    <main>
        <h1>Create your StudyFlow account</h1>

        <p>
            Register below. Your account must be approved
            before you can access StudyFlow.
        </p>

        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Register
            </button>
        </form>
    </main>
</body>
</html>
