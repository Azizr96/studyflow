{% extends "base.html" %}

{% block title %}
    Register | StudyFlow
{% endblock %}

{% block content %}

    <h1>Create your StudyFlow account</h1>

    <p>
        Register below. Your account must be approved
        before you can access StudyFlow.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Register
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'accounts:login' %}">
            Login
        </a>
    </p>

{% endblock %}
