{% extends "base.html" %}

{% block content %}

<h1>Add Visit</h1>

<p>
    <strong>Participant:</strong>
    {{ participant.participant_number }} -
    {{ participant.first_name }} {{ participant.last_name }}
</p>

<p>
    <strong>Study:</strong>
    {{ study.protocol_number }} - {{ study.title }}
</p>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Add Visit
    </button>

    <a href="{% url 'studies:study_detail' study.id %}">
        Cancel
    </a>
</form>

{% endblock %}
